<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Rock Paper Scissors Game</h1>
    <div class="buttons">
        <button id="rock">Rock</button>
        <button id="paper">Paper</button>
        <button id="scissors">Scissors</button>
    </div>
    <div id="results">
        <p id="roundResult">Make your move!</p>
        <p id="score">Score: You 0 | Computer 0</p>
        <p id="winner"></p>
    </div>
    <script>
    function playGame() {
        const CHOICES= ["rock", "paper", "scissors"]; //array [0][1][2] is used to store options, Will be able to add new options later.
        const WINNING_SCORE=5; //ends game when one player reaches 5pts
        
        let humanScore = 0;
        let computerScore = 0;
        
        //grabs DOM elements from page to update
        const roundResult= document.getElementById("roundResult")
        const scoreDisplay= document.getElementById("score")
        const winnerDisplay= document.getElementById("winner")
        const buttons= document.querySelectorAll("button")
        
        //getComputerChoice
        function getComputerChoice(){
            const randomIndex= Math.floor(Math.random()*CHOICES.length); //length: 3, so range is 0-2.999...which is then rounded down by Math.floor
            return CHOICES[randomIndex]; //outputs 1 element from array with the value generated from randomIndex(0,1,2)
        //if randomIndex=CHOICES.length -> undefined bc that index does not exist, thats y Math.floor() is needed.    
        }
        
        //updates score on page
        function updateScore() {
            scoreDisplay.textContent = `Score: You ${humanScore} | Computer ${computerScore}`;
        }

        function endGame(){
            buttons.forEach(button => button.disabled = true);
            if (humanScore === WINNING_SCORE) {
            winnerDisplay.textContent = "You won the game!";
            } else {
            winnerDisplay.textContent = "Computer won the game!";
            }
            }

        //playRound -> take player & comp moves, determine winner of rounds, update correct scores, print result
        function playRound(humanChoice, computerChoice){

            if (humanScore === WINNING_SCORE || computerScore === WINNING_SCORE) {
            return;
            }
            //convert choices into index positions.
            const humanIndex= CHOICES.indexOf(humanChoice);
            const computerIndex=CHOICES.indexOf(computerChoice);

            //safety guard. indexOf() returns -1 if value not found. eg, enter wrong word.
            //not necessary bc this program already validates input before calling playRound. But still good defensive coding?in case bug from later changes.
            if (humanIndex === -1 || computerIndex === -1){
                roundResult.textContent = "Invalid choice.";
                return;
            }
            //tie check
            if (humanChoice === computerChoice){
                roundResult.textContent = `Tie! Both chose ${humanChoice}.`;
                updateScore();
                return;
            } 
            
            //Winner math.
            const result = (humanIndex - computerIndex + CHOICES.length) % CHOICES.length;
            //eg, humanIndex = 1, computerIndex = 0
            //(1-0+3)%3 = 4%3 = 1 -> human wins. Winning case always = 1. 
            //this logic only works on exact order of CHOICES

            if (result===1){
                humanScore++;
                roundResult.textContent = `You win this round! ${humanChoice} beats ${computerChoice}.`;
            } else {
                computerScore++;
                roundResult.textContent = `You lost! ${computerChoice} beats ${humanChoice}.`;
            }
            updateScore();
            if (humanScore === WINNING_SCORE || computerScore === WINNING_SCORE) {
            endGame();
            }
        }
        document.getElementById("rock").addEventListener("click", () => {
        playRound("rock", getComputerChoice());
      });

      document.getElementById("paper").addEventListener("click", () => {
        playRound("paper", getComputerChoice());
      });

      document.getElementById("scissors").addEventListener("click", () => {
        playRound("scissors", getComputerChoice());
      });
    }
    playGame();
    </script>
    
</body>
</html>
